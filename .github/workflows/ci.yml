name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze
        # Infos are not fatal: newer Flutter releases add deprecations (e.g. the
        # material.dart move) that the package's minimum Flutter cannot adopt.
        run: |
          for pkg in packages/flutter_pdfview_platform_interface packages/flutter_pdfview packages/flutter_pdfview/example packages/flutter_pdfview_android_pdfium; do
            (cd "$pkg" && flutter analyze --no-pub --no-fatal-infos .)
          done
      - name: Test
        run: |
          for pkg in packages/flutter_pdfview_platform_interface packages/flutter_pdfview packages/flutter_pdfview/example; do
            (cd "$pkg" && flutter test)
          done

  android:
    name: Android (${{ matrix.engine }} engine)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engine bundled with flutter_pdfview.
          - engine: bundled
            module: packages/flutter_pdfview/android
            plugin_class: io.endigo.plugins.pdfviewflutter.PDFViewFlutterPlugin
          # The opt-in flutter_pdfview_android_pdfium package, which must
          # replace the bundled engine when an app depends on it directly.
          - engine: pdfium
            module: packages/flutter_pdfview_android_pdfium/android
            plugin_class: io.endigo.plugins.pdfviewflutter.pdfium.PDFViewFlutterPlugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Opt the example into the PDFium engine
        if: matrix.engine == 'pdfium'
        working-directory: packages/flutter_pdfview/example
        run: dart pub add 'flutter_pdfview_android_pdfium:{"path":"../../flutter_pdfview_android_pdfium"}'
      - name: Resolve workspace
        run: flutter pub get
      - name: Build example APK
        working-directory: packages/flutter_pdfview/example
        run: flutter build apk --debug
      - name: Check which engine was registered
        working-directory: packages/flutter_pdfview/example
        run: |
          registrant=android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          grep -n 'PDFViewFlutterPlugin' "$registrant"
          grep -q "new ${{ matrix.plugin_class }}()" "$registrant"
          test "$(grep -c 'PDFViewFlutterPlugin()' "$registrant")" -eq 1
      - name: Report bundled native libraries
        # Lists the .so files the example APK ships, so engine changes can be
        # checked for added or removed native binaries.
        working-directory: packages/flutter_pdfview/example
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          ls -l "$apk"
          unzip -l "$apk" | grep '\.so$' || true
      - name: Android unit tests
        env:
          ANDROID_MODULE: ${{ matrix.module }}
        run: ./scripts/run_android_unit_tests.sh

  emulator:
    # Drives example/integration_test against the real native viewer.
    name: Emulator (${{ matrix.engine }} engine, API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # androidx.pdf's floor: Android 9, where it runs without the
          # S Extensions 13 system update.
          - engine: androidx
            api: 28
            target: google_apis
          - engine: androidx
            api: 35
            target: google_apis
          - engine: pdfium
            api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Opt the example into the PDFium engine
        if: matrix.engine == 'pdfium'
        working-directory: packages/flutter_pdfview/example
        run: dart pub add 'flutter_pdfview_android_pdfium:{"path":"../../flutter_pdfview_android_pdfium"}'
      - name: Resolve workspace
        run: flutter pub get
      - name: Pre-build the test APK
        # Building outside the emulator step keeps the emulator's lifetime short.
        working-directory: packages/flutter_pdfview/example
        run: flutter build apk --debug
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: packages/flutter_pdfview/example
          # On failure, dump the engine's log lines plus every warning/error so
          # the cause is visible in the job log.
          script: adb logcat -c; flutter test integration_test --dart-define=PDFVIEW_ENGINE=${{ matrix.engine }} -r expanded || { adb logcat -d -v brief FlutterPDFView:V '*:W' | grep -v -E 'ResourceType|Choreographer' | tail -n 400; exit 1; }
