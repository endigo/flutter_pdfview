name: flutter_pdfview
description: A Flutter plugin that provides a PDFView widget on Android and iOS.
version: 1.5.0-beta.11
homepage: https://github.com/endigo/flutter_pdfview
repository: https://github.com/endigo/flutter_pdfview
issue_tracker: https://github.com/endigo/flutter_pdfview/issues

# Resolved as part of the workspace declared in the repository-root pubspec.
resolution: workspace

topics:
  - pdf
  - viewer
  - native

environment:
  # flutter_lints ^6 requires Dart >=3.8; formatter.page_width needs Dart >=3.7;
  # Color.toARGB32() is used for backgroundColor serialization (Flutter >=3.27,
  # raised here with the lints toolchain).
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # The shared platform interface. Inside this workspace the constraint resolves
  # to packages/flutter_pdfview_platform_interface; on pub.dev it resolves to the
  # published package, so that one must be released first.
  flutter_pdfview_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.endigo.plugins.pdfviewflutter
        pluginClass: PDFViewFlutterPlugin
      ios:
        pluginClass: FLTPDFViewFlutterPlugin
