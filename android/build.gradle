group 'io.endigo.plugins.pdfview'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
    }

    lint {
        disable 'InvalidPackage'
    }


    testOptions {
        // Robolectric needs the merged android resources/manifest on the unit test classpath.
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
    if (project.android.hasProperty("namespace")) { namespace 'io.endigo.plugins.pdfviewflutter' }

    // #287: pdfium-android ships libc++_shared.so; apps that also pull another
    // native lib (ffmpeg-kit, etc.) hit mergeDebugNativeLibs conflicts.
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'com.github.marain87:AndroidPdfViewer:3.2.8'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.19.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

